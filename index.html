<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a14">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ORBIT BEAT</title>
<style>
  /* 전체 화면 캔버스 — 스크롤/터치 제스처 차단 */
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden;
               background:#0a0a14; touch-action:none; overscroll-behavior:none;
               -webkit-user-select:none; user-select:none;
               -webkit-touch-callout:none; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
"use strict";
/* ============================================================
 * ORBIT BEAT — 원버튼 궤도 리듬게임 · 놀이공원 에디션
 * 단일 파일 · Canvas 2D · Web Audio 합성 (외부 에셋 없음)
 *
 * 핵심 규칙:
 *  - 두 행성 중 하나는 타일에 고정, 다른 하나가 공전 (1비트 = 180도)
 *  - 타일 n에 착지한 순간 공전 시작각 = (이전 타일 방향 + 180도),
 *    목표각 = 타일 n의 진행 방향. 공전 방향으로 남은 각도 Δ가
 *    그 타일의 박자 길이(Δ/180 비트)를 결정한다.
 *  - 시간 기준은 전부 AudioContext.currentTime (rAF는 렌더링 전용)
 *
 * 놀이공원 에디션:
 *  - 맵 32개 (초급 10 / 중급 15 / 고급 7), 전부 놀이기구 테마
 *  - 맵마다 다른 색 테마와 다른 음악(조성·진행·드럼·리드·시드 멜로디)
 *  - 타격감: 줌 펀치 / 행성 팝 / 타일 플래시 / 콤보 / 콘페티 / 불꽃놀이
 * ============================================================ */

/* ===================== 1. 공용 유틸 ===================== */
const TAU = Math.PI * 2, D2R = Math.PI / 180;
const mod360 = a => ((a % 360) + 360) % 360;          // 0~360 정규화
const clamp  = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp   = (a, b, k) => a + (b - a) * k;
const rep    = (v, n) => Array(n).fill(v);
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const noteFreq = semi => 440 * Math.pow(2, semi / 12); // A4 기준 반음 → 주파수

// 시드 난수 (맵마다 같은 멜로디가 나오도록 결정적으로 생성)
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ===================== 2. 캔버스 / 리사이즈 ===================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
let vignetteCv = null;   // 비네트 캐시 (리사이즈 때만 재생성)
let stars = [];          // 배경 별 입자 40개
let bgGrad = null, bgGradKey = ''; // 배경 그라데이션 캐시 (resize에서 무효화)

// roundRect 폴리필 (구형 브라우저 대비)
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  // 비네트: 중앙 투명 → 가장자리 어둡게
  vignetteCv = document.createElement('canvas');
  vignetteCv.width = W; vignetteCv.height = H;
  const vc = vignetteCv.getContext('2d');
  const g = vc.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32,
                                    W / 2, H / 2, Math.max(W, H) * 0.72);
  g.addColorStop(0, 'rgba(0,0,0,0)');
  g.addColorStop(1, 'rgba(0,0,0,0.55)');
  vc.fillStyle = g; vc.fillRect(0, 0, W, H);
  // 별 입자 재배치
  stars = [];
  for (let i = 0; i < 40; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H,
                 r: 0.6 + Math.random() * 1.4, z: 0.3 + Math.random() * 0.7,
                 tw: Math.random() * TAU });
  }
  bgGradKey = '';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);
resize();

// 터치 기기 감지 — 안내 문구를 탭 기준으로 표시
const IS_TOUCH = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
window.addEventListener('contextmenu', e => e.preventDefault());

/* ===================== 3. 오디오 엔진 (전부 합성) ===================== */
let actx = null;                 // AudioContext — 첫 사용자 입력 시 생성
let master, musicBus, sfxBus;    // 버스: 음악 / 효과음 분리
let noiseBuf = null;             // 화이트노이즈 버퍼
let inputOffset = 0;             // 보정 오프셋(초). 변수로만 보관.

/* ---- 모바일 오디오 잠금 해제 ----
 * iOS 대응 3종 세트: (1) audioSession playback — 무음 스위치 무시,
 * (2) 무음 <audio> 루프(데이터 URI) — 구형 iOS 세션 전환,
 * (3) 제스처 안 무음 버퍼 '킥' — 출력 경로 개방. */
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
const SILENT_WAV = 'data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA';
let unmuteEl = null;
function unlockMedia() {
  if (!unmuteEl) {
    unmuteEl = document.createElement('audio');
    unmuteEl.src = SILENT_WAV;
    unmuteEl.loop = true;
    unmuteEl.setAttribute('playsinline', '');
    unmuteEl.setAttribute('preload', 'auto');
  }
  const p = unmuteEl.play();
  if (p && p.catch) p.catch(() => {});
}
function kickAudio() { // iOS: 제스처 안에서 실제 노드를 한 번 재생해야 출력이 열림
  if (!actx) return;
  try {
    const src = actx.createBufferSource();
    src.buffer = actx.createBuffer(1, 1, 22050);
    src.connect(actx.destination);
    src.start(0);
  } catch (e) {}
}
function unlockAudio() {
  unlockMedia();
  // 일시정지/카운트다운 중엔 의도적으로 suspend 상태이므로 건드리지 않는다
  if (actx && state !== 'pause' && state !== 'countdown') {
    if (actx.state !== 'running') actx.resume();
    kickAudio();
  }
}
window.addEventListener('pointerdown', unlockAudio, true);
window.addEventListener('touchend', unlockAudio, true);
window.addEventListener('click', unlockAudio, true);
window.addEventListener('keydown', unlockAudio, true);

// 룩어헤드 스케줄러 — 25ms 간격으로 깨어나 100ms 앞까지 예약
const LOOKAHEAD = 0.1, TICK_MS = 25;
const music = { mode: 'off', step: 0, nextTime: 0, t0: 0,
                baseBpm: 100, timeline: [] };

function ensureAudio() {
  if (actx) { actx.resume(); return; }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  master = actx.createGain(); master.gain.value = 0.85;
  const comp = actx.createDynamicsCompressor();
  master.connect(comp); comp.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = 0.72; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 1; sfxBus.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  setInterval(schedule, TICK_MS);
  actx.resume();
  kickAudio();
}

/* ---- 신스 악기 ---- */
function playKick(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(160, t);
  o.frequency.exponentialRampToValueAtTime(44, t + 0.11);
  g.gain.setValueAtTime(0.9, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t + 0.3);
}
function playHat(t, vol) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7500;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.045);
  s.connect(f); f.connect(g); g.connect(musicBus);
  s.start(t); s.stop(t + 0.06);
}
function playClap(t, vol) {
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = 1800; f.Q.value = 1.2;
  g.gain.setValueAtTime(vol || 0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
  s.connect(f); f.connect(g); g.connect(musicBus);
  s.start(t); s.stop(t + 0.12);
}
function playBass(t, freq, dur) {
  const o = actx.createOscillator(), f = actx.createBiquadFilter(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = freq;
  f.type = 'lowpass'; f.frequency.value = 640;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.2, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(f); f.connect(g); g.connect(musicBus);
  o.start(t); o.stop(t + dur + 0.05);
}
// 리드: 맵별 음색 (saw 풍성 / square 명랑 / tri 부드러움 / pluck 통통)
function playLead(t, freq, dur, type) {
  const g = actx.createGain(), f = actx.createBiquadFilter();
  f.type = 'lowpass';
  const bright = type === 'pluck' ? 3200 : type === 'square' ? 2800 : 2400;
  f.frequency.setValueAtTime(700, t);
  f.frequency.exponentialRampToValueAtTime(bright, t + 0.03);
  f.frequency.exponentialRampToValueAtTime(850, t + Math.max(0.09, dur));
  const vol = type === 'tri' ? 0.16 : 0.1;
  const sus = type === 'pluck' ? Math.min(dur, 0.16) : dur;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.setValueAtTime(vol, t + Math.max(0.012, sus - 0.05));
  g.gain.exponentialRampToValueAtTime(0.001, t + sus + 0.08);
  const waves = type === 'saw' ? [['sawtooth', -6], ['sawtooth', 6]]
              : type === 'square' ? [['square', 0]]
              : type === 'tri' ? [['triangle', 0]]
              : [['square', -4], ['square', 5]]; // pluck
  for (const [w, det] of waves) {
    const o = actx.createOscillator();
    o.type = w; o.frequency.value = freq; o.detune.value = det;
    o.connect(f); o.start(t); o.stop(t + sus + 0.12);
  }
  f.connect(g); g.connect(musicBus);
}
function playPad(t, semi, dur) { // 마디 시작 화음 패드 (은은하게)
  for (const s of [semi, semi + 7]) {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'triangle'; o.frequency.value = noteFreq(s);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.06);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(musicBus);
    o.start(t); o.stop(t + dur + 0.05);
  }
}
function playTick(t, accent) { // 메트로놈 틱 (보정 화면)
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square'; o.frequency.value = accent ? 1568 : 1046.5;
  g.gain.setValueAtTime(accent ? 0.34 : 0.24, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + 0.07);
}
// 착지 타격음: 저음 '쿵' + 클릭 + 핑 3레이어 (타격감의 핵심)
function playHit(t, perfect) {
  const th = actx.createOscillator(), tg = actx.createGain(); // 저음 몸통
  th.type = 'sine';
  th.frequency.setValueAtTime(200, t);
  th.frequency.exponentialRampToValueAtTime(64, t + 0.06);
  tg.gain.setValueAtTime(0.5, t);
  tg.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
  th.connect(tg); tg.connect(sfxBus);
  th.start(t); th.stop(t + 0.14);
  const s = actx.createBufferSource(), hf = actx.createBiquadFilter(), ng = actx.createGain();
  s.buffer = noiseBuf; hf.type = 'highpass'; hf.frequency.value = 4000; // 클릭
  ng.gain.setValueAtTime(0.16, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  s.connect(hf); hf.connect(ng); ng.connect(sfxBus);
  s.start(t); s.stop(t + 0.03);
  const o = actx.createOscillator(), g = actx.createGain(); // 핑
  o.type = 'triangle'; o.frequency.value = perfect ? 1318.5 : 987.8;
  g.gain.setValueAtTime(0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + 0.13);
  if (perfect) { // 완벽: 반짝이 한 톨 추가
    const o2 = actx.createOscillator(), g2 = actx.createGain();
    o2.type = 'sine'; o2.frequency.value = 2637;
    g2.gain.setValueAtTime(0.06, t + 0.02);
    g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    o2.connect(g2); g2.connect(sfxBus);
    o2.start(t + 0.02); o2.stop(t + 0.14);
  }
}
function playComboDing(t, n) { // 10콤보마다 상승음
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'triangle';
  o.frequency.value = noteFreq(Math.min(24, 7 + n * 2));
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + 0.34);
}
function playFail(t) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(220, t);
  o.frequency.exponentialRampToValueAtTime(48, t + 0.45);
  g.gain.setValueAtTime(0.22, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + 0.55);
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), ng = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = 2500;
  ng.gain.setValueAtTime(0.2, t);
  ng.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  s.connect(f); f.connect(ng); ng.connect(sfxBus);
  s.start(t); s.stop(t + 0.35);
}
function playFanfare(t) { // 클리어 팡파르 (장조 아르페지오 + 상행)
  [0, 4, 7, 12, 16, 19, 24].forEach((semi, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    const tt = t + i * 0.09;
    o.type = 'triangle'; o.frequency.value = noteFreq(semi - 5);
    g.gain.setValueAtTime(0.13, tt);
    g.gain.exponentialRampToValueAtTime(0.001, tt + 0.5);
    o.connect(g); g.connect(sfxBus);
    o.start(tt); o.stop(tt + 0.55);
  });
}

/* ---- 음악 데이터: 맵마다 다른 곡을 만드는 파라메트릭 작곡 엔진 ---- */
// 스케일 (도수 → 반음). 장조/자연단조/도리안/믹솔리디안
const SCALES = {
  maj:  [0, 2, 4, 5, 7, 9, 11],
  min:  [0, 2, 3, 5, 7, 8, 10],
  dor:  [0, 2, 3, 5, 7, 9, 10],
  mixo: [0, 2, 4, 5, 7, 9, 10],
};
function degSemi(scale, deg) { // 1-기준 도수(7 초과 = 옥타브 위) → 반음
  const d = deg - 1;
  return 12 * Math.floor(d / 7) + SCALES[scale][((d % 7) + 7) % 7];
}
// 드럼 스타일 (16분음표 16스텝 기준 배치)
const DRUMS = {
  four:   { kick: [0, 4, 8, 12], clap: [4, 12], hat: [2, 6, 10, 14], ghost: [7, 15] },
  bounce: { kick: [0, 8],        clap: [4, 12], hat: [2, 6, 10, 14], ghost: [] },      // 움파(놀이공원)
  drive:  { kick: [0, 6, 8, 12], clap: [4, 12], hat: [0, 2, 4, 6, 8, 10, 12, 14], ghost: [] },
  half:   { kick: [0],           clap: [8],     hat: [4, 12],        ghost: [10] },
};
// 멜로디 리듬 템플릿 (마디 안에서 음이 놓이는 스텝)
const RHYTHMS = [
  [0, 4, 8, 12], [0, 4, 8, 10, 12], [0, 6, 8, 12], [0, 4, 6, 8, 12], [0, 8, 12], [0, 3, 6, 8, 12],
];
// 맵의 song 스펙 → 실제 재생 데이터(멜로디는 시드 기반 결정적 생성)
function compileSong(level, idx) {
  const sp = level.song;
  const rng = mulberry32(idx * 7919 + 13);
  const prog = sp.prog;
  const melody = new Map();
  let cur = 8; // 도수 커서 (루트 옥타브 위 부근)
  for (let bar = 0; bar < 8; bar++) {
    const c = prog[bar % prog.length];
    const chord = [c + 7, c + 9, c + 11, c + 14]; // 옥타브 위 코드톤
    const rhythm = RHYTHMS[Math.floor(rng() * RHYTHMS.length)];
    for (let i = 0; i < rhythm.length; i++) {
      const s = rhythm[i];
      let deg;
      if (bar === 7 && i === rhythm.length - 1) deg = 8; // 마지막은 으뜸음으로 종지
      else if (rng() < 0.62) deg = chord[Math.floor(rng() * chord.length)];
      else deg = cur + (rng() < 0.5 ? 1 : -1); // 순차 진행
      deg = clamp(deg, 6, 17);
      cur = deg;
      const next = i + 1 < rhythm.length ? rhythm[i + 1] : 16;
      melody.set(bar * 16 + s, [sp.key + degSemi(sp.scale, deg), Math.min(next - s, 6)]);
    }
  }
  return { ...sp, drums: DRUMS[sp.drums], drumStyle: sp.drums, melody };
}

function musicBpmAt(rel) {
  let b = music.baseBpm;
  for (const c of music.timeline) { if (rel >= c.rel - 1e-6) b = c.bpm; else break; }
  return b;
}
let flashAt = -9, rayAt = -9; // 다운비트 플래시/광선 트리거 (스케줄러가 기록)
function scheduleStep(step, t) {
  const song = R && R.songData;
  if (!song) return;
  const bpm = musicBpmAt(t - music.t0);
  const stepDur = 15 / bpm;
  const bar = Math.floor(step / 16) % 8;
  const s16 = step % 16;
  const d = song.drums;
  if (d.kick.includes(s16)) playKick(t);
  if (d.clap.includes(s16)) playClap(t, 0.16);
  if (d.hat.includes(s16)) playHat(t, song.drumStyle === 'drive' && s16 % 4 === 2 ? 0.26 : 0.2);
  if (d.ghost.includes(s16)) playHat(t, 0.09);
  // 베이스: 스타일별 패턴
  const rootSemi = song.key - 24 + degSemi(song.scale, song.prog[bar % song.prog.length]);
  if (song.drumStyle === 'bounce') {          // 움파: 저음-5도 교대 (경쾌한 놀이공원 리듬)
    if (s16 === 0 || s16 === 8) playBass(t, noteFreq(rootSemi), stepDur * 3);
    if (s16 === 4 || s16 === 12) playBass(t, noteFreq(rootSemi + 7), stepDur * 3);
  } else if (song.drumStyle === 'drive') {    // 드라이브: 8분음표 질주
    if (s16 % 2 === 0) playBass(t, noteFreq(s16 % 8 === 6 ? rootSemi + 12 : rootSemi), stepDur * 1.7);
  } else {                                    // four/half: 펌핑
    if (s16 % 2 === 0) playBass(t, noteFreq(s16 === 14 ? rootSemi + 7 : rootSemi), stepDur * 1.7);
  }
  if (s16 === 0) {
    playPad(t, song.key - 12 + degSemi(song.scale, song.prog[bar % song.prog.length]), stepDur * 12);
    flashAt = t;                              // 다운비트 화면 플래시
    if (step % 64 === 0) rayAt = t;           // 4마디마다 방사 광선
  }
  const m = song.melody.get(step % 128);
  if (m) playLead(t, noteFreq(m[0]), m[1] * stepDur, song.lead);
}

function schedule() {
  if (!actx) return;
  if (music.mode === 'music') {
    while (music.nextTime < actx.currentTime + LOOKAHEAD) {
      scheduleStep(music.step, music.nextTime);
      const bpm = musicBpmAt(music.nextTime - music.t0);
      music.nextTime += 15 / bpm;
      music.step = (music.step + 1) % 128;
    }
  } else if (music.mode === 'calib') {
    // 오디오가 실제로 구동되기 전엔 메트로놈 시작을 미룬다 (iOS 첫 탭 대응)
    if (actx.state !== 'running') { music.nextTime = actx.currentTime + 0.4; return; }
    while (music.nextTime < actx.currentTime + LOOKAHEAD) {
      playTick(music.nextTime, music.step % 4 === 0);
      calib.beatTimes.push(music.nextTime);
      if (calib.beatTimes.length > 24) calib.beatTimes.shift();
      music.nextTime += 60 / 100;
      music.step++;
    }
  }
}
function stopMusic() { music.mode = 'off'; }

/* 맵은 토큰 문자열로 정의한다 (진행 방향 커서 방식):
 *   S = 직진(1박)  R/L = 90도 우/좌회전(1.5박/0.5박)
 *   r/l = 45도 우/좌회전(1.25박/0.75박)  U = U턴(2박, 숨 고르기)
 *   V = 다음 타일에 소용돌이(공전 반전)  F/H/N = 다음 타일부터 1.5x/0.5x/원속
 * 회전 후엔 커서가 바뀌므로 문자열이 곧 트랙 모양이자 리듬 악보가 된다. */
function buildMap(pattern) {
  let dir = 0;
  const angles = [], vortex = [], speed = {};
  for (const ch of pattern) {
    if (ch === 'R') dir = mod360(dir + 90);
    else if (ch === 'L') dir = mod360(dir - 90);
    else if (ch === 'r') dir = mod360(dir + 45);
    else if (ch === 'l') dir = mod360(dir - 45);
    else if (ch === 'U') dir = mod360(dir + 180);
    else if (ch === 'V') { vortex.push(angles.length); continue; }
    else if (ch === 'F') { speed[angles.length] = 1.5; continue; }
    else if (ch === 'H') { speed[angles.length] = 0.5; continue; }
    else if (ch === 'N') { speed[angles.length] = 1; continue; }
    else if (ch !== 'S') continue;
    angles.push(dir);
  }
  return { angles, vortex, speed };
}
// 레벨 정의 헬퍼: L(단계, 이름, BPM, 패턴, 곡 스펙, 테마)
function L(tier, name, bpm, pattern, song, theme) {
  const m = buildMap(pattern);
  return { tier, name, bpm, angles: m.angles, vortex: m.vortex, speed: m.speed,
           song, theme: THEMES[theme] };
}

/* ===================== 6. 타이밍 계산 (게임의 심장) ===================== */
const TILE = 64;        // 타일 간 거리 = 공전 반지름(px)
const INTRO_BEATS = 4;  // 첫 착지 전 카운트인 박자 수
const TILE_TH = 26;     // 트랙 두께

/* 트랙 전체의 이론상 도착 시각을 곡 시작 시점에 전부 미리 계산.
 * 타일 i→i+1: 시작각 = (직전 방향+180), 목표각 = 현재 방향.
 * 공전 방향 d로 도는 각도 Δ (0이면 360) → 박자 = Δ/180. */
function buildTiming(level) {
  const N = level.angles.length;
  const tiles = [];
  let x = 0, y = 0, d = 1, mult = 1, arrival = 0;
  for (let i = 0; i < N; i++) {
    if (level.vortex.includes(i)) d = -d;
    if (level.speed[i] !== undefined) mult = level.speed[i];
    const bpm = level.bpm * mult, spb = 60 / bpm;
    const startAngle = (i === 0 ? level.angles[0] : level.angles[i - 1]) + 180;
    const target = level.angles[i];
    let delta = mod360(d * (target - startAngle));
    if (delta < 1e-9) delta = 360;
    const beats = delta / 180;
    tiles.push({ x, y, out: level.angles[i], dir: d, bpm, spb,
                 beats, delta, arrival,
                 vortex: level.vortex.includes(i),
                 speedMark: level.speed[i] });
    arrival += beats * spb;
    x += TILE * Math.cos(level.angles[i] * D2R);
    y += TILE * Math.sin(level.angles[i] * D2R);
  }
  tiles.push({ x, y, out: level.angles[N - 1], dir: d,
               bpm: level.bpm * mult, spb: 60 / (level.bpm * mult),
               beats: 0, delta: 0, arrival, vortex: false });
  return tiles;
}

function orbitAngle(now) {
  const seg = R.tiles[R.idx];
  const tArr = R.t0 + R.tiles[R.idx + 1].arrival;
  const omega = 180 / seg.spb;
  return seg.out - seg.dir * omega * (tArr - now);
}
function orbitPos(now) {
  const seg = R.tiles[R.idx];
  const a = orbitAngle(now) * D2R;
  return { x: seg.x + TILE * Math.cos(a), y: seg.y + TILE * Math.sin(a) };
}

/* 각도 기반: errDeg = (입력시각-도착시각)/spb × 180 (음수 = 빠름)
 * ±25 완벽 / ±45 살짝 / ±60 빠름!·느림! / -60 미만 과입력 미스
 * +60 초과(지나침)는 update()에서 자동 미스 */
function gamePress(tRaw) {
  if (state !== 'play' || R.finished) return;
  if (tRaw - R.lastLand < 0.045) return;
  const t = tRaw - inputOffset;
  const seg = R.tiles[R.idx];
  const tArr = R.t0 + R.tiles[R.idx + 1].arrival;
  const errDeg = (t - tArr) / seg.spb * 180;
  if (errDeg < -60) { die(tRaw, '너무 빠름!'); return; }
  if (errDeg > 60)  { die(tRaw, '놓침'); return; }
  const a = Math.abs(errDeg);
  let key;
  if (a <= 25) key = 'perfect';
  else if (a <= 45) key = errDeg < 0 ? 'early' : 'late';
  else key = errDeg < 0 ? 'early2' : 'late2';
  land(tRaw, key, errDeg);
}

function land(tRaw, key, errDeg) {
  const j = JUDGE[key];
  const th = R.level.theme;
  R.idx++;
  R.lastLand = tRaw;
  R.stats[key]++; R.stats.inputs++; R.stats.weight += j.w;

  // 콤보: 완벽/살짝은 잇고 빠름!/느림!은 끊김

  popups.push({ txt: j.txt, color: j.color, x: tl.x, y: tl.y, t0: tRaw });
  shocks.push({ x: tl.x, y: tl.y, t0: tRaw, color: '#ffffff' });
  if (perfect) shocks.push({ x: tl.x, y: tl.y, t0: tRaw + 0.05, color: th.accent });

    const confettiColors = [th.accent, th.accent2, '#ffffff'];
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * TAU + Math.random() * 0.6;
      const sp = 70 + Math.random() * 90;
      parts.push({ x: tl.x, y: tl.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 30,
                   t0: tRaw, life: 0.55 + Math.random() * 0.25, grav: 160,
                   rot: Math.random() * TAU, rect: Math.random() < 0.6,
                   color: confettiColors[i % 3] });
    }
  }
  if (parts.length > 150) parts.splice(0, parts.length - 150);
  zoomKick = Math.min(0.09, zoomKick + (perfect ? 0.055 : 0.035));
  shake = perfect ? 3.4 : 2.4;
  planetPopT = tRaw;
  R.flashT[R.idx] = tRaw;
  if (tl.vortex) rotKick += (Math.random() < 0.5 ? 1 : -1) * 2.5; // 소용돌이 회전 킥
  trail = [];
  errTicks.push({ deg: errDeg, t0: tRaw });
  playHit(actx.currentTime, perfect);
  if (R.idx >= R.tiles.length - 1) { // 클리어!
    R.finished = true;
    clearT = tRaw;
    state = 'clear';
    stopMusic();
    musicBus.gain.setTargetAtTime(0, actx.currentTime + 0.4, 0.5);
    playFanfare(actx.currentTime + 0.3);
    finalizeResult();
  }
}

function finalizeResult() {
  const s = R.stats;
  s.acc = s.inputs ? (s.weight / s.inputs) * 100 : 100;
  let g;
  if (s.acc >= 95) g = 'S'; else if (s.acc >= 88) g = 'A';
  else if (s.acc >= 75) g = 'B'; else g = 'C';
  if (s.deaths > 0 && g === 'S') g = 'A'; // 노미스가 아니면 S 불가
  s.grade = g;
  const order = ['C', 'B', 'A', 'S'];
  if (!grades[R.li] || order.indexOf(g) > order.indexOf(grades[R.li])) grades[R.li] = g;
}

function die(now, reason) {
  const seg = R.tiles[R.idx];
  const p = orbitPos(now);
  const a = orbitAngle(now) * D2R;
  const omega = (180 / seg.spb) * D2R;
  const speed = omega * TILE;
  deadAnim = {
    x: p.x, y: p.y, x0: p.x, y0: p.y,
    vx: -Math.sin(a) * speed * seg.dir + Math.cos(a) * 40,
    vy:  Math.cos(a) * speed * seg.dir + Math.sin(a) * 40,
    t0: now, red: R.idx % 2 === 1,
  };
  for (let i = 0; i < 10; i++) {
    const pa = Math.random() * TAU, sp = 40 + Math.random() * 130;
    parts.push({ x: p.x, y: p.y, vx: Math.cos(pa) * sp, vy: Math.sin(pa) * sp,
                 t0: now, life: 0.7, grav: 0, rect: false,
                 color: deadAnim.red ? '#ff2d55' : '#00c2ff' });
  }
  popups.push({ txt: reason, color: '#ff5252', x: p.x, y: p.y, t0: now });
  R.stats.deaths++;
  R.combo = 0;
  shake = 4;
  state = 'dead';
  stopMusic();
  musicBus.gain.setTargetAtTime(0, actx.currentTime, 0.12);
  playFail(actx.currentTime);
}

/* ===================== 9. 입력 처리 ===================== */
const GAME_KEYS = new Set(['Space', 'KeyF', 'KeyJ']);
let hotRects = [];

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  const t = actx ? actx.currentTime : 0;
  if (e.code === 'Space') e.preventDefault();
  handleAction(e.code, t);
});
canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const t = actx ? actx.currentTime : 0;
  // 버튼 히트 테스트 먼저 — resume은 가드된 unlockAudio로만
  for (const r of hotRects) {
    if (e.clientX >= r.x && e.clientX <= r.x + r.w &&
        e.clientY >= r.y && e.clientY <= r.y + r.h) {
      if (!actx) ensureAudio(); else unlockAudio();
      r.cb(); return;
    }
  }
  handleAction('__pointer', t);
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (state === 'play' || state === 'countdown') pauseGame();
    if (unmuteEl) unmuteEl.pause();
  } else {
    if (actx && actx.state === 'suspended' && state !== 'pause' && state !== 'countdown')
      actx.resume();
    if (unmuteEl && actx) unlockMedia();
  }
});

function pauseGame() {
  state = 'pause';
  actx.suspend(); // currentTime 동결 → 재개 시 음악 위치 정확히 복원
}
function resumeCountdown() {
  state = 'countdown';
  countdownT0 = performance.now();
}
function handleAction(code, t) {
  switch (state) {
    case 'title':
      ensureAudio();
      if (calibDone) { state = 'select'; }
      else { enterCalib(); }
      break;
    case 'calib':
      if (code === 'Escape') { finishCalib(true); break; }
      if (code === 'Enter' && calib.done) { finishCalib(false); break; }
      if (code === '__pointer' || GAME_KEYS.has(code)) calibTap(t);
      break;
    case 'select':
      if (code === 'Escape') { state = 'title'; break; }
      break;
    case 'play':
      if (code === 'Escape') { pauseGame(); break; }
      if (code === '__pointer' || GAME_KEYS.has(code)) gamePress(t);
      break;
    case 'pause':
      if (code === 'KeyQ') { actx.resume(); stopMusic(); state = 'select'; break; }
      if (code === 'Escape' || code === 'Enter' || code === '__pointer' || GAME_KEYS.has(code))
        resumeCountdown();
      break;
    case 'result':
      if (code === 'KeyR' || code === 'Enter') startGame(levelIdx);
      else if (code === 'KeyL' || code === 'Escape') state = 'select';
      break;
  }
}

/* ---- 보정 화면 ---- */
function enterCalib() {
  state = 'calib';
  calib.taps.length = 0; calib.beatTimes.length = 0; calib.done = false;
  music.mode = 'calib';
  music.step = 0;
  music.nextTime = actx.currentTime + 0.4;
}
function calibTap(t) {
  if (calib.done) return;
  let best = null;
  for (const bt of calib.beatTimes) {
    const err = t - bt;
    if (Math.abs(err) < 0.3 && (best === null || Math.abs(err) < Math.abs(best))) best = err;
  }
  if (best === null) return;
  calib.taps.push(best);
  playTick(actx.currentTime, false);
  if (calib.taps.length >= 8) {
    inputOffset = calib.taps.reduce((a, b) => a + b, 0) / calib.taps.length;
    inputOffset = clamp(inputOffset, -0.2, 0.2);
    calib.done = true;
  }
}
function finishCalib(skipped) {
  if (skipped) inputOffset = inputOffset || 0;
  calibDone = true;
  stopMusic();
  state = 'select';
}

/* ===================== 10. 업데이트 (오디오 시계 기준) ===================== */
function update() {
  if (!actx) return;
  const now = actx.currentTime;
  if (state === 'play' && !R.finished) {
    const seg = R.tiles[R.idx];
    const tArr = R.t0 + R.tiles[R.idx + 1].arrival;
    if (now - inputOffset > tArr + seg.spb / 3) die(now, '놓침');
  }
  if (state === 'dead' && now - deadAnim.t0 > 1.0) startRun(R.li, true);
  if (state === 'clear' && now - clearT > 2.2) state = 'result';
  if (state === 'countdown' && performance.now() - countdownT0 > 1800) {
    state = 'play';
    actx.resume();
  }
}

/* ===================== 11. 렌더링 ===================== */
function themeNow() { return R ? R.level.theme : THEMES.violet; }

function drawBackground(pulse) {
  const th = themeNow();
  const key = W + 'x' + H + th.bg[0];
  if (bgGradKey !== key) {
    bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, th.bg[0]);
    bgGrad.addColorStop(1, th.bg[1]);
    bgGradKey = key;
  }
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);
  const t = performance.now() / 1000;
  // 놀이공원 장식: 대관람차 실루엣(점 12개 링) + 떠다니는 풍선 도형
  drawParkDecor(t, th);
  // 별 입자
  for (const s of stars) {
    s.x += 3 * s.z * 0.016;
    if (s.x > W + 4) s.x = -4;
    ctx.globalAlpha = 0.14 + 0.18 * (0.5 + 0.5 * Math.sin(t * 0.8 + s.tw));
    ctx.fillStyle = th.star;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * s.z, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawParkDecor(t, th) {
  // 대관람차: 오른쪽 아래에 크고 흐리게, 천천히 회전
  const cx = W * 0.85, cy = H * 0.88, rr = Math.min(W, H) * 0.34;
  ctx.globalAlpha = 0.05;
  ctx.strokeStyle = th.accent;
  ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, rr, 0, TAU); ctx.stroke();
  for (let i = 0; i < 12; i++) {
    const a = t * 0.08 + (i / 12) * TAU;
    const px = cx + Math.cos(a) * rr, py = cy + Math.sin(a) * rr;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();
    ctx.fillStyle = i % 2 ? th.accent : th.accent2;
    ctx.globalAlpha = 0.09;
    ctx.beginPath(); ctx.arc(px, py, 6, 0, TAU); ctx.fill();
    ctx.globalAlpha = 0.05;
  }
  // 풍선(원형 도형 3개) 왼쪽에서 두둥실
  for (let i = 0; i < 3; i++) {
    const bx = W * 0.12 + i * W * 0.07;
    const by = H * (0.75 - 0.06 * i) + Math.sin(t * 0.4 + i * 2.1) * 14;
    ctx.globalAlpha = 0.06;
    ctx.fillStyle = i % 2 ? th.accent2 : th.accent;
    ctx.beginPath(); ctx.arc(bx, by, 14 + i * 4, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function drawVignette(pulse) {
  ctx.globalAlpha = clamp(0.92 + 0.05 * pulse, 0, 1);
  ctx.drawImage(vignetteCv, 0, 0, W, H);
  ctx.globalAlpha = 1;
}

/* ---- 트랙 ---- */
function drawTrack(now) {
  const th = R.level.theme;
  const tiles = R.tiles;
  const segLen = TILE + 14;
  for (let pass = 0; pass < 2; pass++) {
    for (let i = 0; i < tiles.length - 1; i++) {
      const a = tiles[i], b = tiles[i + 1];
      const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(a.out * D2R);
      ctx.beginPath();
      if (pass === 0) {
        ctx.fillStyle = th.edge;
        ctx.roundRect(-segLen / 2 - 1, -TILE_TH / 2 - 1, segLen + 2, TILE_TH + 2, 7);
        ctx.fill();
      } else {
        ctx.fillStyle = i === R.idx ? lightenCache(th.track, 16) :
                        i < R.idx ? lightenCache(th.track, 7) : th.track;
        ctx.roundRect(-segLen / 2, -TILE_TH / 2, segLen, TILE_TH, 6);
        ctx.fill();
        // 착지 직후 타일 화이트 플래시 (0.3초)
        const ft = R.flashT[i + 1];
        if (now - ft < 0.3) {
          ctx.globalAlpha = 0.5 * (1 - (now - ft) / 0.3);
          ctx.fillStyle = '#ffffff';
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }
      ctx.restore();
    }
  }
  // 다음 목표 타일 예고 펄스 (액센트 색 테두리)
  if (!R.finished && R.idx + 1 < tiles.length) {
    const seg = tiles[R.idx];
    const tArr = R.t0 + tiles[R.idx + 1].arrival;
    const closeness = clamp(1 - (tArr - now) / (seg.beats * seg.spb), 0, 1);
    const nt = tiles[R.idx + 1];
    ctx.globalAlpha = 0.25 + 0.45 * closeness;
    ctx.strokeStyle = th.accent;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(nt.x, nt.y, 17 - 4 * closeness, 0, TAU);
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  // 특수 타일 아이콘 + 도착 지점 링
  for (let i = 1; i < tiles.length - 1; i++) {
    const tl = tiles[i];
    if (tl.vortex) drawVortexIcon(tl.x, tl.y);
    if (tl.speedMark !== undefined) drawSpeedIcon(tl.x, tl.y, tl.out, tl.speedMark);
  }
  const goal = tiles[tiles.length - 1];
  ctx.strokeStyle = th.accent;
  ctx.globalAlpha = 0.8;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(goal.x, goal.y, 9, 0, TAU); ctx.stroke();
  ctx.globalAlpha = 1;
}
// 색상 밝히기 캐시 (#rrggbb + n)
const _lcache = {};
function lightenCache(hex, n) {
  const k = hex + n;
  if (_lcache[k]) return _lcache[k];
  const v = '#' + [1, 3, 5].map(i =>
    clamp(parseInt(hex.slice(i, i + 2), 16) + n, 0, 255).toString(16).padStart(2, '0')).join('');
  return (_lcache[k] = v);
}
function drawVortexIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = '#c07aff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let a = 0; a <= 4.6; a += 0.25) {
    const r = 1.5 + a * 1.75;
    const px = Math.cos(a * 1.5) * r, py = Math.sin(a * 1.5) * r;
    a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
  }
  ctx.stroke();
  ctx.restore();
}
function drawSpeedIcon(x, y, ang, mult) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang * D2R);
  ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  const chev = (ox, dir) => {
    ctx.beginPath();
    ctx.moveTo(ox - 3 * dir, -5); ctx.lineTo(ox + 3 * dir, 0); ctx.lineTo(ox - 3 * dir, 5);
    ctx.stroke();
  };
  if (mult > 1)      { ctx.strokeStyle = '#ffb069'; chev(-4, 1); chev(3, 1); }
  else if (mult < 1) { ctx.strokeStyle = '#7ad7ff'; chev(0, -1); }
  else {
    ctx.strokeStyle = '#9a9ab0';
    ctx.beginPath(); ctx.arc(0, 0, 4, 0, TAU); ctx.stroke();
  }
  ctx.restore();
}

/* ---- 행성 (착지 순간 팝: 반지름이 커졌다 돌아옴) ---- */
function drawPlanet(x, y, red, glow, alpha, pop) {
  const r = 14 * (1 + (pop || 0) * 0.32);
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = red ? '#ff2d55' : '#00c2ff';
  ctx.shadowBlur = 20 * glow;
  const g = ctx.createRadialGradient(x - 4, y - 4, 2, x, y, r);
  if (red) { g.addColorStop(0, '#ffd9e0'); g.addColorStop(0.45, '#ff2d55'); g.addColorStop(1, '#a51236'); }
  else     { g.addColorStop(0, '#d9f7ff'); g.addColorStop(0.45, '#00c2ff'); g.addColorStop(1, '#00688f'); }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  ctx.fill();
  ctx.restore();
}
function drawTrail(red) {
  for (let i = 0; i < trail.length; i++) {
    const k = (i + 1) / trail.length;
    ctx.globalAlpha = 0.28 * Math.pow(k, 1.6);
    ctx.fillStyle = red ? '#ff2d55' : '#00c2ff';
    ctx.beginPath();
    ctx.arc(trail[i].x, trail[i].y, 14 * (0.35 + 0.5 * k), 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ---- 이펙트 ---- */
function drawEffects(now) {
  // 충격파 (이중 링)
  shocks = shocks.filter(s => now - s.t0 < 0.32 && now >= s.t0);
  for (const s of shocks) {
    const k = (now - s.t0) / 0.32;
    ctx.globalAlpha = 0.6 * (1 - k);
    ctx.strokeStyle = s.color;
    ctx.lineWidth = 3 * (1 - k) + 0.5;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 8 + 46 * easeOutCubic(k), 0, TAU);
    ctx.stroke();
  }
  // 광선 버스트 (콤보 마일스톤)
  rays = rays.filter(r => now - r.t0 < 0.55);
  for (const r of rays) {
    const k = (now - r.t0) / 0.55;
    ctx.globalAlpha = 0.5 * (1 - k);
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * TAU + k * 0.9;
      const r1 = 20 + 90 * easeOutCubic(k), r2 = r1 + 26 * (1 - k);
      ctx.beginPath();
      ctx.moveTo(r.x + Math.cos(a) * r1, r.y + Math.sin(a) * r1);
      ctx.lineTo(r.x + Math.cos(a) * r2, r.y + Math.sin(a) * r2);
      ctx.stroke();
    }
  }
  // 입자/콘페티 (중력 + 회전 사각 조각)
  parts = parts.filter(p => now - p.t0 < p.life);
  for (const p of parts) {
    const dt = now - p.t0, k = dt / p.life;
    const px = p.x + p.vx * dt, py = p.y + p.vy * dt + 0.5 * (p.grav || 0) * dt * dt;
    ctx.globalAlpha = 1 - k;
    ctx.fillStyle = p.color;
    if (p.rect) {
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate((p.rot || 0) + dt * 7);
      ctx.fillRect(-2.6, -1.6, 5.2, 3.2);
      ctx.restore();
    } else {
      ctx.beginPath();
      ctx.arc(px, py, 2.5 * (1 - k) + 0.5, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  // 판정 팝업
  popups = popups.filter(p => now - p.t0 < 0.5);
  for (const p of popups) {
    const k = (now - p.t0) / 0.5, e = easeOutCubic(k);
    ctx.save();
    ctx.translate(p.x, p.y - 26 - 30 * e);
    ctx.scale(0.55 + 0.6 * e, 0.55 + 0.6 * e);
    ctx.globalAlpha = 1 - k * k;
    ctx.fillStyle = p.color;
    ctx.font = "600 17px 'Segoe UI','Pretendard',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(p.txt, 0, 0);
    ctx.restore();
  }
}

/* ---- HUD ---- */
function drawHUD(now) {
  const th = R.level.theme;
  const s = R.stats;
  const acc = s.inputs ? (s.weight / s.inputs) * 100 : 100;
  ctx.font = "500 15px 'Segoe UI','Pretendard',sans-serif";
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(230,230,245,0.85)';
  ctx.textAlign = 'left';
  ctx.fillText(`정확도 ${acc.toFixed(1)}%`, 18, 16);
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(220,220,240,0.6)';
  ctx.fillText(R.level.name, W / 2, 16);
  ctx.textAlign = 'right';
  const prog = (R.idx / (R.tiles.length - 1)) * 100;
  ctx.fillStyle = 'rgba(230,230,245,0.85)';
  ctx.fillText(`진행 ${prog.toFixed(0)}%`, W - 66, 24);
  if (s.deaths > 0) {
    ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,120,120,0.7)';
    ctx.fillText(`재시도 ${s.deaths}`, 18, 38);
  }
  // 일시정지 버튼
  if (state === 'play') {
    const pb = { x: W - 54, y: 10, w: 44, h: 44 };
    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.strokeStyle = 'rgba(160,160,190,0.4)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(pb.x, pb.y, pb.w, pb.h, 10); ctx.fill(); ctx.stroke();
    ctx.fillStyle = 'rgba(220,220,240,0.85)';
    ctx.fillRect(pb.x + 15, pb.y + 13, 4.5, 18);
    ctx.fillRect(pb.x + 25, pb.y + 13, 4.5, 18);
    hotRects.push({ ...pb, label: '일시정지',
                    cb: () => { if (state === 'play') pauseGame(); } });
  }
  // 콤보 카운터 (증가 순간 팝)
  if (R.combo >= 2) {
    const popK = clamp((now - comboPopT) / 0.18, 0, 1);
    const sc = 1 + 0.35 * (1 - easeOutCubic(popK));
    ctx.save();
    ctx.translate(W / 2, H - 92);
    ctx.scale(sc, sc);
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = th.accent;
    ctx.font = "700 26px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText(String(R.combo), 0, 0);
    ctx.fillStyle = 'rgba(220,220,240,0.5)';
    ctx.font = "500 11px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText('COMBO', 0, 21);
    ctx.restore();
  }
  // 히트 에러 바
  const bw = Math.min(320, W * 0.6), bh = 6, bx = W / 2 - bw / 2, by = H - 42;
  ctx.fillStyle = 'rgba(255,255,255,0.08)';
  ctx.beginPath(); ctx.roundRect(bx, by, bw, bh, 3); ctx.fill();
  ctx.fillStyle = 'rgba(255,215,106,0.22)';
  const pz = bw * (25 / 60) / 2;
  ctx.fillRect(W / 2 - pz, by, pz * 2, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(W / 2 - 0.5, by - 3, 1, bh + 6);
  errTicks = errTicks.filter(e => now - e.t0 < 1.8);
  for (const e of errTicks) {
    const k = (now - e.t0) / 1.8;
    const x = W / 2 + clamp(e.deg / 60, -1, 1) * bw / 2;
    ctx.globalAlpha = (1 - k) * 0.9;
    ctx.fillStyle = Math.abs(e.deg) <= 25 ? '#ffd76a' : (e.deg < 0 ? '#7ad7ff' : '#ff9d6c');
    ctx.fillRect(x - 1, by - 5, 2, bh + 10);
  }
  ctx.globalAlpha = 1;
  if (R.idx === 0 && !R.finished) {
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(220,220,240,0.55)';
    ctx.font = "400 14px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText(IS_TOUCH ? '비트에 맞춰 화면을 탭' : '비트에 맞춰 스페이스 · F · J · 탭',
                 W / 2, H - 70);
  }
}

/* ---- 자간 타이틀 텍스트 ---- */
function drawSpacedText(txt, x, y, font, spacingEm, color) {
  ctx.font = font;
  ctx.textBaseline = 'middle';
  const size = parseInt(font.match(/(\d+)px/)[1], 10);
  const sp = size * spacingEm;
  let total = 0;
  for (const ch of txt) total += ctx.measureText(ch).width + sp;
  total -= sp;
  let cx = x - total / 2;
  ctx.fillStyle = color;
  ctx.textAlign = 'left';
  for (const ch of txt) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + sp;
  }
}

/* ---- 버튼 ---- */
function button(x, y, w, h, label, cb, sub, opts) {
  const o = opts || {};
  ctx.save();
  ctx.strokeStyle = o.stroke || 'rgba(160,160,190,0.45)';
  ctx.lineWidth = o.lineWidth || 1;
  ctx.fillStyle = o.fill || 'rgba(255,255,255,0.04)';
  ctx.beginPath(); ctx.roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = o.color || 'rgba(235,235,250,0.92)';
  ctx.font = o.font || "600 17px 'Segoe UI','Pretendard',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, x + w / 2, y + h / 2 - (sub ? 10 : 0));
  if (sub) {
    ctx.fillStyle = 'rgba(180,180,205,0.65)';
    ctx.font = "400 12px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText(sub, x + w / 2, y + h / 2 + 13);
  }
  ctx.restore();
  hotRects.push({ x, y, w, h, cb, label });
}

/* ---- 화면들 ---- */
function drawTitle() {
  drawBackground(0);
  const t = performance.now() / 1000;
  const cx = W / 2, cy = H / 2 - 110, r = 42;
  const a = t * 1.4;
  drawPlanet(cx + Math.cos(a) * r, cy + Math.sin(a) * r, true, 1, 1, 0);
  drawPlanet(cx - Math.cos(a) * r, cy - Math.sin(a) * r, false, 1, 1, 0);
  const ts = Math.round(Math.min(44, W * 0.095));
  drawSpacedText('ORBIT BEAT', W / 2, H / 2 + 10,
                 `700 ${ts}px 'Segoe UI','Pretendard',sans-serif`, 0.3, '#e9e9f7');
  ctx.globalAlpha = 0.7;
  ctx.fillStyle = '#b9a9d4';
  ctx.font = "400 13px 'Segoe UI','Pretendard',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('리듬 놀이공원', W / 2, H / 2 + 46);
  ctx.globalAlpha = 0.35 + 0.45 * (0.5 + 0.5 * Math.sin(t * 2.2));
  ctx.fillStyle = '#b9b9d4';
  ctx.font = "400 16px 'Segoe UI','Pretendard',sans-serif";
  ctx.fillText(IS_TOUCH ? '화면을 탭해 시작' : '아무 키나 눌러 시작', W / 2, H / 2 + 84);
  ctx.globalAlpha = 1;
  drawAudioHint();
  drawVignette(0);
}
function drawAudioHint() {
  if (!actx || actx.state === 'running') return;
  ctx.fillStyle = 'rgba(255,215,106,0.75)';
  ctx.font = "400 13px 'Segoe UI','Pretendard',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('사운드 활성화를 위해 화면을 한 번 더 탭하세요', W / 2, H - 28);
}

function drawCalib() {
  drawBackground(0);
  const now = actx ? actx.currentTime : 0;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  drawSpacedText('CALIBRATION', W / 2, H * 0.22,
                 "700 26px 'Segoe UI','Pretendard',sans-serif", 0.3, '#e9e9f7');
  ctx.fillStyle = 'rgba(210,210,230,0.8)';
  ctx.font = "400 15px 'Segoe UI','Pretendard',sans-serif";
  ctx.fillText('메트로놈 소리에 맞춰 8회 탭하세요', W / 2, H * 0.32);
  if (!IS_TOUCH) {
    ctx.fillStyle = 'rgba(160,160,185,0.6)';
    ctx.font = "400 13px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText('ESC — 건너뛰기', W / 2, H * 0.32 + 26);
  }
  let pulse = 0;
  for (const bt of calib.beatTimes) {
    const d = now - bt;
    if (d >= 0 && d < 0.25) pulse = Math.max(pulse, 1 - d / 0.25);
  }
  ctx.strokeStyle = 'rgba(230,230,250,0.85)';
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(W / 2, H / 2 + 10, 26 + pulse * 10, 0, TAU); ctx.stroke();
  ctx.fillStyle = `rgba(122,215,255,${0.15 + pulse * 0.5})`;
  ctx.beginPath(); ctx.arc(W / 2, H / 2 + 10, 18, 0, TAU); ctx.fill();
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i < calib.taps.length ? '#ffd76a' : 'rgba(255,255,255,0.15)';
    ctx.beginPath();
    ctx.arc(W / 2 - 70 + i * 20, H / 2 + 78, 4, 0, TAU);
    ctx.fill();
  }
  if (calib.done) {
    ctx.fillStyle = '#ffd76a';
    ctx.font = "500 16px 'Segoe UI','Pretendard',sans-serif";
    ctx.fillText(`오프셋 ${(inputOffset * 1000).toFixed(0)}ms`, W / 2, H / 2 + 118);
    button(W / 2 - 80, H / 2 + 146, 160, 44, IS_TOUCH ? '완료' : '완료 (Enter)',
           () => finishCalib(false));
  } else {
    button(W / 2 - 80, H - 92, 160, 44, '건너뛰기', () => finishCalib(true));
  }
  drawVignette(0);
}

/* ---- 레벨 선택: 탭(초급/중급/고급) + 그리드 ---- */
function drawSelect() {
  drawBackground(0);
  const hs = Math.round(Math.min(24, W * 0.055));
  drawSpacedText('LEVEL SELECT', W / 2, Math.max(34, H * 0.08),
                 `700 ${hs}px 'Segoe UI','Pretendard',sans-serif`, 0.3, '#e9e9f7');
  // 난이도 탭
  const tabW = Math.min(110, (W - 60) / 3), tabH = 40;
  const tabsX = W / 2 - (tabW * 3 + 20) / 2;
  const tabY = Math.max(62, H * 0.13);
  TIERS.forEach((tier, i) => {
    const x = tabsX + i * (tabW + 10);
    const active = selTab === i;
    button(x, tabY, tabW, tabH, tier.name, () => { selTab = i; }, null, {
      fill: active ? 'rgba(255,255,255,0.1)' : 'rgba(255,255,255,0.03)',
      stroke: active ? tier.color : 'rgba(160,160,190,0.3)',
      color: active ? tier.color : 'rgba(200,200,220,0.6)',
      lineWidth: active ? 1.5 : 1,
    });
  });
  // 현재 탭의 맵 그리드
  const list = [];
  LEVELS.forEach((lv, id) => { if (lv.tier === selTab) list.push({ lv, id }); });
  const gy0 = tabY + tabH + 16;
  const availH = H - gy0 - 30;
  const cols = W >= 900 ? 5 : W >= 620 ? 4 : W >= 400 ? 3 : 2;
  const rows = Math.ceil(list.length / cols);
  const gap = 10;
  const cardW = Math.min(170, (Math.min(W - 32, cols * 180) - (cols - 1) * gap) / cols);
  const cardH = clamp((availH - (rows - 1) * gap) / rows, 44, 78);
  const gridW = cols * cardW + (cols - 1) * gap;
  const gx0 = W / 2 - gridW / 2;
  list.forEach((item, i) => {
    const cx = gx0 + (i % cols) * (cardW + gap);
    const cy = gy0 + Math.floor(i / cols) * (cardH + gap);
    const num = i + 1;
    const g = grades[item.id];
    button(cx, cy, cardW, cardH, `${num}. ${item.lv.name}`,
           () => startGame(item.id),
           cardH >= 58 ? `${item.lv.bpm} BPM` : null, {
             font: `600 ${cardW < 120 ? 12 : 14}px 'Segoe UI','Pretendard',sans-serif`,
             stroke: g ? item.lv.theme.accent : 'rgba(160,160,190,0.35)',
           });
    if (g) {
      ctx.fillStyle = { S: '#ffd76a', A: '#7ad7ff', B: '#9effa0', C: '#a8a8b8' }[g];
      ctx.font = "700 13px 'Segoe UI','Pretendard',sans-serif";
      ctx.textAlign = 'right'; ctx.textBaseline = 'top';
      ctx.fillText(g, cx + cardW - 7, cy + 5);
    }
  });
  button(14, 14, 82, 36, '타이틀', () => { state = 'title'; },
         null, { font: "500 14px 'Segoe UI','Pretendard',sans-serif" });
  drawAudioHint();
  drawVignette(0);
}

/* ---- 플레이 화면 ---- */
function drawPlay() {
  const now = actx.currentTime;
  const th = R.level.theme;
  const seg = R.tiles[Math.min(R.idx, R.tiles.length - 2)];
  const segT0 = R.t0 + R.tiles[R.idx].arrival;
  const frac = mod360(((now - segT0) / seg.spb) * 360) / 360 % 1;
  const pulse = Math.pow(1 - (frac % 1), 2);
  drawBackground(pulse);

  // 카메라: lerp 추적 + 숨쉬는 줌 + 착지 줌 펀치 + (고급) 회전
  const fixedTl = R.tiles[R.idx];
  const op = state === 'dead' ? { x: deadAnim.x, y: deadAnim.y }
           : R.finished ? R.tiles[R.tiles.length - 2]
           : orbitPos(now);
  cam.x = lerp(cam.x, (fixedTl.x + op.x) / 2, 0.08);
  cam.y = lerp(cam.y, (fixedTl.y + op.y) / 2, 0.08);
  const breathe = 1 + 0.08 * Math.sin((now - R.t0) * 0.33);
  zoomKick *= 0.88;
  rotKick *= 0.92;
  const scale = clamp(Math.min(W, H) / 760, 0.55, 1.15) * breathe * (1 + zoomKick);
  const camRot = (R.level.tier === 2 ? 4 * Math.sin((now - R.t0) * 0.2) : 0) + rotKick;
  shake *= 0.86;
  const shx = (Math.random() * 2 - 1) * shake, shy = (Math.random() * 2 - 1) * shake;

  ctx.save();
  ctx.translate(W / 2 + shx, H / 2 + shy);
  ctx.rotate(camRot * D2R);
  ctx.scale(scale, scale);
  ctx.translate(-cam.x, -cam.y);

  drawTrack(now);
  drawEffects(now);

  const redFixed = R.idx % 2 === 0;
  const glow = 1 + 0.05 * pulse;
  const pop = Math.max(0, 1 - (now - planetPopT) / 0.14);
  if (state === 'dead') {
    const dt = now - deadAnim.t0;
    deadAnim.x = deadAnim.x0 + deadAnim.vx * dt;
    deadAnim.y = deadAnim.y0 + deadAnim.vy * dt;
    drawPlanet(fixedTl.x, fixedTl.y, redFixed, glow, 1, 0);
    drawPlanet(deadAnim.x, deadAnim.y, deadAnim.red, glow, clamp(1 - dt / 0.9, 0, 1), 0);
  } else if (R.finished) {
    const prev = R.tiles[R.tiles.length - 2];
    drawPlanet(prev.x, prev.y, !redFixed, glow, 1, 0);
    drawPlanet(fixedTl.x, fixedTl.y, redFixed, glow, 1, pop);
  } else {
    trail.push({ x: op.x, y: op.y });
    if (trail.length > 12) trail.shift();
    drawTrail(!redFixed);
    drawPlanet(fixedTl.x, fixedTl.y, redFixed, glow, 1, pop);
    drawPlanet(op.x, op.y, !redFixed, glow, 1, 0);
  }
  ctx.restore();

  // 다운비트 화면 플래시 (은은한 액센트 색)
  const fk = (now - flashAt) / 0.3;
  if (fk >= 0 && fk < 1) {
    ctx.globalAlpha = 0.05 * (1 - fk);
    ctx.fillStyle = th.accent;
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 1;
  }
  // 4마디 광선 (화면 모서리에서 은은하게)
  const rk = (now - rayAt) / 0.6;
  if (rk >= 0 && rk < 1) {
    ctx.globalAlpha = 0.08 * (1 - rk);
    ctx.strokeStyle = th.accent2;
    ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * TAU + rk;
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * W * 0.32, H / 2 + Math.sin(a) * W * 0.32);
      ctx.lineTo(W / 2 + Math.cos(a) * W * 0.6, H / 2 + Math.sin(a) * W * 0.6);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // 배속 구간 스피드라인
  if (seg.bpm > R.level.bpm * 1.15 && state === 'play') {
    ctx.globalAlpha = 0.1;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    for (let i = 0; i < 10; i++) {
      const a = (i / 10) * TAU + now * 2.4;
      const r1 = Math.min(W, H) * 0.42, r2 = r1 + 40 + 24 * Math.sin(now * 9 + i);
      ctx.beginPath();
      ctx.moveTo(W / 2 + Math.cos(a) * r1, H / 2 + Math.sin(a) * r1);
      ctx.lineTo(W / 2 + Math.cos(a) * r2, H / 2 + Math.sin(a) * r2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  drawVignette(pulse);
  drawHUD(now);
  if (state === 'clear') drawClearOverlay(now);
}

/* ---- 클리어: 불꽃놀이 + CLEAR ---- */
let lastFw = -9;
function drawClearOverlay(now) {
  const th = R.level.theme;
  const el = now - clearT;
  // 0.25초 간격 불꽃 버스트 (파티클 시스템 재사용)
  if (now - lastFw > 0.25 && el < 1.8) {
    lastFw = now;
    const fx = R.tiles[R.tiles.length - 1].x + (Math.random() - 0.5) * 260;
    const fy = R.tiles[R.tiles.length - 1].y - 60 - Math.random() * 140;
    const col = [th.accent, th.accent2, '#ffffff'][Math.floor(Math.random() * 3)];
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU, sp = 60 + Math.random() * 110;
      parts.push({ x: fx, y: fy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                   t0: now, life: 0.8, grav: 90, rect: Math.random() < 0.4,
                   rot: Math.random() * TAU, color: col });
    }
  }
  if (el > 0.4) {
    const k = clamp((el - 0.4) / 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = k;
    ctx.translate(W / 2, H * 0.4);
    ctx.scale(0.8 + 0.2 * easeOutCubic(k), 0.8 + 0.2 * easeOutCubic(k));
    ctx.shadowColor = th.accent; ctx.shadowBlur = 24;
    drawSpacedText('CLEAR!', 0, 0,
                   `700 ${Math.round(Math.min(52, W * 0.11))}px 'Segoe UI','Pretendard',sans-serif`,
                   0.22, '#ffffff');
    ctx.restore();
  }
}

function drawPauseOverlay() {
  ctx.fillStyle = 'rgba(6,6,12,0.72)';
  ctx.fillRect(0, 0, W, H);
  drawSpacedText('PAUSED', W / 2, H / 2 - 50,
                 "700 30px 'Segoe UI','Pretendard',sans-serif", 0.3, '#e9e9f7');
  if (!IS_TOUCH) {
    ctx.fillStyle = 'rgba(200,200,220,0.75)';
    ctx.font = "400 14px 'Segoe UI','Pretendard',sans-serif";
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('ESC — 재개 · Q — 레벨 선택', W / 2, H / 2 - 6);
  }
  const bw = Math.min(160, W / 2 - 25), by = H / 2 + (IS_TOUCH ? 10 : 32);
  button(W / 2 - bw - 10, by, bw, 46, '재개', resumeCountdown);
  button(W / 2 + 10, by, bw, 46, '레벨 선택',
         () => { actx.resume(); stopMusic(); state = 'select'; });
}
function drawCountdownOverlay() {
  ctx.fillStyle = 'rgba(6,6,12,0.5)';
  ctx.fillRect(0, 0, W, H);
  const el = performance.now() - countdownT0;
  const n = 3 - Math.floor(el / 600);
  const k = (el % 600) / 600;
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(1 + 0.25 * easeOutCubic(k), 1 + 0.25 * easeOutCubic(k));
  ctx.globalAlpha = 1 - k * 0.7;
  ctx.fillStyle = '#e9e9f7';
  ctx.font = "700 64px 'Segoe UI','Pretendard',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(String(Math.max(1, n)), 0, 0);
  ctx.restore();
}

function drawResult() {
  drawBackground(0);
  const th = R.level.theme;
  const s = R.stats;
  const hs = Math.round(Math.min(28, W * 0.065));
  drawSpacedText('RESULT', W / 2, H * 0.1,
                 `700 ${hs}px 'Segoe UI','Pretendard',sans-serif`, 0.3, '#e9e9f7');
  ctx.fillStyle = 'rgba(210,210,230,0.7)';
  ctx.font = "500 15px 'Segoe UI','Pretendard',sans-serif";
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(`${TIERS[R.level.tier].name} · ${R.level.name}`, W / 2, H * 0.17);
  const gc = { S: '#ffd76a', A: '#7ad7ff', B: '#9effa0', C: '#a8a8b8' }[s.grade];
  ctx.save();
  ctx.shadowColor = gc; ctx.shadowBlur = 26;
  ctx.fillStyle = gc;
  ctx.font = "700 84px 'Segoe UI','Pretendard',sans-serif";
  ctx.fillText(s.grade, W / 2, H * 0.32);
  ctx.restore();
  ctx.fillStyle = 'rgba(235,235,250,0.9)';
  ctx.font = "500 18px 'Segoe UI','Pretendard',sans-serif";
  ctx.fillText(`정확도 ${s.acc.toFixed(1)}%`, W / 2, H * 0.44);
  ctx.fillStyle = th.accent;
  ctx.font = "500 15px 'Segoe UI','Pretendard',sans-serif";
  ctx.fillText(`최대 콤보 ${R.maxCombo}`, W / 2, H * 0.49);
  const rows = [
    ['완벽', s.perfect, '#ffd76a'],
    ['살짝 빠름 / 느림', s.early + s.late, '#7ad7ff'],
    ['빠름! / 느림!', s.early2 + s.late2, '#ff9d6c'],
    ['미스 (재시작)', s.deaths, '#ff5252'],
  ];
  ctx.font = "400 15px 'Segoe UI','Pretendard',sans-serif";
  rows.forEach((r, i) => {
    const y = H * 0.56 + i * 25;
    ctx.textAlign = 'right'; ctx.fillStyle = 'rgba(190,190,210,0.85)';
    ctx.fillText(r[0], W / 2 + 30, y);
    ctx.textAlign = 'left'; ctx.fillStyle = r[2];
    ctx.fillText(String(r[1]), W / 2 + 48, y);
  });
  const bw = Math.min(160, W / 2 - 25);
  button(W / 2 - bw - 10, H * 0.79, bw, 46, IS_TOUCH ? '다시하기' : '다시하기 (R)',
         () => startGame(levelIdx));
  button(W / 2 + 10, H * 0.79, bw, 46, IS_TOUCH ? '레벨 선택' : '레벨 선택 (L)',
         () => { state = 'select'; });
  drawVignette(0);
}

/* ===================== 12. 메인 루프 (rAF — 렌더링 전용) ===================== */
function frame() {
  update();
  hotRects = [];
  switch (state) {
    case 'title':  drawTitle(); break;
    case 'calib':  drawCalib(); break;
    case 'select': drawSelect(); break;
    case 'play':
    case 'dead':
    case 'clear':  drawPlay(); break;
    case 'pause':      drawPlay(); drawPauseOverlay(); break;
    case 'countdown':  drawPlay(); drawCountdownOverlay(); break;
    case 'result': drawResult(); break;
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ===================== 13. 테스트 훅 (자동 검증용) ===================== */
window.__OB = {
  buildTiming, buildMap, LEVELS, TIERS, INTRO_BEATS, mod360,
  get state() { return state; },
  get run() { return R; },
  get audioTime() { return actx ? actx.currentTime : -1; },
  get audioState() { return actx ? actx.state : 'none'; },
  get calib() { return calib; },
  get offset() { return inputOffset; },
  get hotRects() { return hotRects; },
  press() { const t = actx ? actx.currentTime : 0; gamePress(t); },
  boot() { ensureAudio(); calibDone = true; state = 'select'; },
  start(i) { ensureAudio(); calibDone = true; startGame(i); },
  setTab(i) { selTab = i; },
};
</script>
